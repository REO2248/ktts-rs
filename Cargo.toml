[workspace]
resolver = "2"
members = ["crates/ktts-dict", "crates/ktts-engine", "crates/ktts-cli", "crates/ktts-kma", "crates/ktts-pron", "crates/ktts-prosody", "crates/ktts-synth", "crates/ktts-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"


[profile.release]
lto = true
codegen-units = 1
strip = true
