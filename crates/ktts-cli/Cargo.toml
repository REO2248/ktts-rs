[package]
name = "ktts-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "ktts"

[[bin]]
name = "ktts"
path = "src/main.rs"

[features]
# Embeds the kttsdb dictionary data into the binary at build time,
# producing a standalone `ktts` that needs no data directory.
embed = []

[dependencies]
clap = { version = "4", features = ["derive"] }
ktts-dict = { path = "../ktts-dict" }
ktts-kma = { path = "../ktts-kma" }
ktts-pron = { path = "../ktts-pron" }
ktts-prosody = { path = "../ktts-prosody" }
ktts-synth = { path = "../ktts-synth" }

[build-dependencies]
ktts-dict = { path = "../ktts-dict" }

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_qualifications = "deny"
deprecated_in_future = "deny"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
unused_crate_dependencies = "warn"
[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
