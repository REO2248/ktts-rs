[package]
name = "ktts-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Embeds the kttsdb dictionary data into the wasm binary at build time
# (`wasm-pack build --features embed`), so the JS side does not need to
# fetch and pass the dictionary files.
embed = []

[dependencies]
ktts-dict = { path = "../ktts-dict" }
ktts-kma = { path = "../ktts-kma" }
ktts-pron = { path = "../ktts-pron" }
ktts-prosody = { path = "../ktts-prosody" }
ktts-synth = { path = "../ktts-synth" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[build-dependencies]
ktts-dict = { path = "../ktts-dict" }

[dev-dependencies]
sha2 = "0.11"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_qualifications = "deny"
deprecated_in_future = "deny"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
unused_crate_dependencies = "warn"
[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
